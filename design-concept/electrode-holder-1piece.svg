<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#fbfbfb"/><text x="255.0" y="70.0" font-family="Helvetica,Arial" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">FRONT view  (the 45° rise)</text><line x1="95.0" y1="560.0" x2="425.0" y2="560.0" stroke="#ccc" stroke-width="1"/><rect x="106.5" y="424.7" width="297.0" height="135.3" rx="0" fill="#cfe0f5" fill-opacity="1" stroke="#1f5fa0" stroke-width="1.5"/><rect x="128.5" y="446.7" width="253.0" height="22.0" rx="0" fill="#cdb6ec" fill-opacity="1" stroke="#6a3da0" stroke-width="1.2"/><text x="255.0" y="439.7" font-family="Helvetica,Arial" font-size="9.5" text-anchor="middle" fill="#6a3da0" font-weight="normal">septum across the open neck</text><rect x="73.5" y="424.7" width="33.0" height="135.3" rx="0" fill="#cfe0f5" fill-opacity="1" stroke="#1f5fa0" stroke-width="1.2"/><rect x="200.0" y="153.0" width="110.0" height="271.7" rx="0" fill="#ffd9a0" fill-opacity="1" stroke="#a06000" stroke-width="1.5"/><polygon points="106.5,424.7 200.0,331.2 200.0,424.7" fill="#ffd9a0" fill-opacity="1" stroke="#a06000" stroke-width="1.4"/><text x="150.5" y="378.5" font-family="Helvetica,Arial" font-size="11" text-anchor="middle" fill="#a06000" font-weight="normal">45°</text><polygon points="403.5,424.7 310.0,331.2 310.0,424.7" fill="#ffd9a0" fill-opacity="1" stroke="#a06000" stroke-width="1.4"/><text x="359.5" y="378.5" font-family="Helvetica,Arial" font-size="11" text-anchor="middle" fill="#a06000" font-weight="normal">45°</text><line x1="255.0" y1="153.0" x2="255.0" y2="813.0" stroke="#8a9099" stroke-width="4"/><text x="255.0" y="807.0" font-family="Helvetica,Arial" font-size="10" text-anchor="middle" fill="#555" font-weight="normal">electrodes</text><line x1="24.0" y1="331.2" x2="139.5" y2="435.7" stroke="#c00" stroke-width="2"/><text x="90.0" y="314.7" font-family="Helvetica,Arial" font-size="10" text-anchor="middle" fill="#c00" font-weigh