---
display_name: electroPioreactor
job_name: electropioreactor
display: true
source: app
description: >
  Drives electrolysis (LED D) at a user-defined power level and periodically
  opens the CO2 solenoid for a user-defined duration. Electrolysis is paused
  during each sparge and resumed immediately afterwards.
published_settings:
  - key: electrolysis_power
    unit: "%"
    label: Electrolysis Power
    description: Intensity of LED D for electrolysis (0-100%). Set to 0 to disable.
    type: numeric
    display: true
  - key: sparge_duration_seconds
    unit: s
    label: Sparging Duration
    description: How long the CO2 solenoid is opened during each sparging cycle.
    type: numeric
    display: true
  - key: sparge_interval_minutes
    unit: min
    label: Sparging Interval
    description: How often a sparging cycle occurs.
    type: numeric
    display: true
  - key: reset_to_defaults
    label: Reset to Defaults
    description: Reset all settings to the values in config.ini.
    type: boolean
    display: true
