changelog:
  - {version: 1.0.0, date: 2026-09-04, note: "Imported from BoM.md item 2.6 (Generic; AEP0.2). BoM qty 1 tops up the four that ship with each Pioreactor; Method step 7 uses four needle ports (Media In, Media Out, Gas Out, Gas Out - safety). 304 is standard; 316 is available for more acidic, basic or salty media."}
  - {version: 1.0.1, date: 2026-09-29, note: "Counted as part of the Pioreactor Vial Cap S that ships with each Pioreactor; the added needle is the 80 mm 316 one (needle-80mm-316) (Martin, 2026-09-29)."}
  - {version: 1.0.2, date: 2026-09-30, note: "Counted again: three for Media In and the two gas outlets; the Pioreactor ships four, the fourth a spare (Martin, Gerrit 2026-09-30)."}
  - {version: 1.0.3, date: 2026-10-02, note: "Renamed from needle-port to match needle-80mm-316 and needle-85mm-316. Gauge added (16G, per pioreactor.com). The Pioreactor box holds three of these plus one 85 mm 316 15G needle, not four; counted on the Pioreactor 40 ml v1.5 row (pioreactor-40ml). Two are used, for the gas outlets, and the third is a spare: Media In moves to the 85 mm 316 needle (needle-85mm-316), since needles that touch the media are 316 (Gerrit 2026-10-02)."}
