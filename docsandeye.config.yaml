theme: pioreactor
project:
  repo: "https://github.com/amy-bo/electroPioreactor"
  branch: AEP02
guides:
  - {id: aep, title: "Aseptic electroPioreactor (AEP0.2)", base: /AEP, pages: [{label: "Protocol", slug: AEP/protocol}]}
  - {id: mep, title: "Mixed-culture electroPioreactor (MEP)", base: /MEP, pages: [{label: "Protocol", slug: MEP/protocol}]}
  - {id: baep, title: "Budget aseptic electroPioreactor (BAEP)", base: /BAEP}
# The parts-count page (step-00) carries the whole receipt table (~45 rows), which takes it just over
# 150 KB, and its tooltips and check-off rows add a little more; videos are YouTube click-to-load, so no page loads video bytes before play.
byte_budget_kb: 200  # step 00 carries the whole parts table plus a video poster
profile:
  - id: model
    type: choice
    guides: [aep]
    label: "Which electroPioreactor are you building?"
    short: "model"
    options:
      - {value: aep-0-2, label: "AEP0.2 (2026), kits included", implies: {temp-kit: true}}
      - {value: aep-0-1-1, label: "AEP0.1.1 (2025)", implies: {temp-kit: false}}
      - {value: custom, label: "Custom build"}
      - {value: mep, label: "Mixed-culture electroPioreactor (MEP): use the MEP guide", href: /MEP/}
      - {value: baep, label: "Budget aseptic electroPioreactor (BAEP): use the BAEP guide", href: /BAEP/}
    default: aep-0-2
  - id: units
    type: number
    guides: [aep]
    label: "How many Pioreactors did you receive?"
    short: "Pioreactors"
    unit_label: "Pioreactor"
    unit_label_plural: "Pioreactors"
    default: 1
    min: 1
    max: 50
  - id: temp-kit
    type: boolean
    guides: [aep]
    label: "Do you have the Precision Temperature Upgrade Kit?"
    short: "temperature kit"
    default: false
  - id: supplier
    type: choice
    guides: [aep]
    label: "Where did your parts come from?"
    short: "supplier"
    options:
      - {value: labcrafter, label: "[LabCrafter](https://labcrafter.co.uk)"}
      - {value: pioreactor, label: "[Pioreactor](https://pioreactor.com)"}
      - {value: diy, label: "Self-sourced from [the BoM](https://github.com/amy-bo/electroPioreactor/tree/main/AsepticElectroPioreactor)"}
    default: labcrafter
receipt:
  multiply_by: units
  supplier_from: supplier
contacts:
  # info@labcrafter.co.uk: listed for LabCrafter on Pioreactor's distributors page and in LabCrafter's own search listing (2026-09-24)
  labcrafter: {name: "LabCrafter", email: "info@labcrafter.co.uk", subject: "Missing parts: AEP0.2 kit"}
  # verify: found at https://docs.pioreactor.com/user-guide/hardware-setup-intro on 2026-09-23 ("Missing a part? Email us at hello@pioreactor.com")
  pioreactor: {name: "Pioreactor", email: "hello@pioreactor.com", subject: "Missing parts: Pioreactor order for an AEP0.2 build"}
  project: {name: "AMYBO", email: "hello@amybo.org", subject: "AEP0.2 guide: help with a step"}
